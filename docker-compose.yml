services:
  backend:
    build: .
    command: node dist/main
    env_file:
      - .env

    ports:
      - "${PORT:-3000}:3000"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: node dist/worker
    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: